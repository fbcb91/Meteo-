<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cielo — il meteo, semplice</title>
  <meta name="description" content="Il meteo in modo semplice e moderno: previsioni chiare, ora per ora e a 7 giorni, con un assistente AI che ti dice cosa aspettarti.">
  <meta name="theme-color" content="#1e6fd9">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%231e6fd9'/%3E%3Ccircle cx='26' cy='26' r='11' fill='%23FFD54A'/%3E%3Cpath d='M22 48h22a8 8 0 0 0 1-16 11 11 0 0 0-21-2 9 9 0 0 0-2 18z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-theme="clear-day">
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="glow" aria-hidden="true"></div>

  <div class="wrap">
    <header class="top">
      <a class="brand" href="./" aria-label="Cielo, home">
        <svg viewBox="0 0 64 64" width="26" height="26" aria-hidden="true"><circle cx="24" cy="24" r="12" fill="#FFD54A"/><path d="M20 50h26a10 10 0 0 0 1-20 14 14 0 0 0-27-3 11.5 11.5 0 0 0 0 23z" fill="#fff"/></svg>
        <span>cielo</span>
      </a>

      <form class="search" id="search" role="search" autocomplete="off">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="q" type="search" placeholder="Cerca una città…" aria-label="Cerca una città"
               role="combobox" aria-expanded="false" aria-controls="suggestions" aria-autocomplete="list"
               enterkeyhint="search" spellcheck="false">
        <ul id="suggestions" class="suggestions" role="listbox" hidden></ul>
      </form>

      <button id="geo" class="icon-btn" type="button" title="Usa la mia posizione" aria-label="Usa la mia posizione">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 2v3m0 14v3M2 12h3m14 0h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg>
      </button>
    </header>

    <nav id="favs" class="favs" aria-label="Città preferite"></nav>

    <div id="status" class="status" role="status" aria-live="polite" hidden></div>

    <main id="app" class="grid" aria-busy="true">
      <section class="hero" aria-labelledby="place">
        <div class="hero-head">
          <h1 id="place"><span class="sk sk-title"></span></h1>
          <button id="fav-toggle" class="icon-btn ghost" type="button" aria-pressed="false" title="Aggiungi ai preferiti" aria-label="Aggiungi ai preferiti" hidden>
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="m12 3 2.7 5.8 6.3.8-4.6 4.4 1.2 6.3L12 17.2 6.4 20.3l1.2-6.3L3 9.6l6.3-.8z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <p id="when" class="when">&nbsp;</p>
        <div class="now">
          <div id="now-temp" class="now-temp"><span class="sk sk-temp"></span></div>
          <div id="now-icon" class="now-icon"></div>
        </div>
        <p id="now-label" class="now-label">&nbsp;</p>
        <p id="now-meta" class="now-meta">&nbsp;</p>
      </section>

      <section class="card ai" aria-labelledby="ai-title">
        <div class="card-head">
          <h2 id="ai-title"><span class="spark" aria-hidden="true">✦</span> Il punto</h2>
          <span id="ai-badge" class="badge" hidden>AI</span>
        </div>
        <p id="ai-text" class="ai-text"><span class="sk sk-line"></span><span class="sk sk-line"></span><span class="sk sk-line short"></span></p>
        <div id="ai-chips" class="chips" hidden>
          <button type="button" data-q="umbrella">Serve l'ombrello?</button>
          <button type="button" data-q="clothes">Come mi vesto?</button>
          <button type="button" data-q="sport">Sport all'aperto?</button>
          <button type="button" data-q="laundry">Stendo i panni?</button>
        </div>
        <div id="ai-answer" class="ai-answer" hidden>
          <p class="ai-q" id="ai-q"></p>
          <p class="ai-a" id="ai-a"></p>
        </div>
        <form id="ask" class="ask" hidden>
          <input id="ask-input" type="text" maxlength="200" placeholder="Chiedi qualcosa sul meteo…" aria-label="Chiedi qualcosa sul meteo">
          <button type="submit" aria-label="Invia">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </form>
      </section>

      <section class="card hourly" aria-labelledby="hourly-title">
        <div class="card-head">
          <h2 id="hourly-title">Ora per ora</h2>
          <button id="back-today" class="link" type="button" hidden>Torna a oggi</button>
        </div>
        <ol id="hours" class="hours" tabindex="0" aria-label="Previsioni orarie"></ol>
      </section>

      <section class="card daily" aria-labelledby="daily-title">
        <div class="card-head"><h2 id="daily-title">Prossimi 7 giorni</h2></div>
        <ol id="days" class="days"></ol>
      </section>

      <section class="details" aria-label="Dettagli">
        <div id="tiles" class="tiles"></div>
      </section>
    </main>

    <footer class="foot">
      <p>Dati meteo di <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> (CC BY 4.0). <span id="ai-note"></span></p>
    </footer>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
